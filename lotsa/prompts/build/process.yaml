process: build
description: |
  Execute at full depth. Autonomous SDLC discipline: plan, failing-tests-first,
  code, review, post-implementation verify, then open a PR and hand off to
  PR watching. The task body (or a spec carried from chat) is the brief — there
  is no separate spec/plan gate. Reach it from chat via the "Build it" handoff,
  or select it directly for a well-understood change.
promotion_inputs:
  - name: draft_spec
    description: A discussed-and-agreed spec the operator wants built rather than
                 re-elicited (e.g. distilled from a chat conversation). Optional —
                 the task body is used when absent.
jobs:
  # ADR-022 — per-step model selection. Every step falls back to the global
  # `model:` in lotsa.yaml; add `model: <name>` on a step to override. The
  # bundled process deliberately ships NO per-step models — assigning them
  # is operator policy, and bundled defaults would silently override the
  # operator's global model on upgrade.
  - name: plan
    type: agent
    prompt: planning
    queue_state: backlog
    active_state: planning

  - name: test
    type: agent
    prompt: testing
    resume: true
    queue_state: testing
    active_state: testing

  - name: code
    type: agent
    prompt: coding
    resume: true
    queue_state: coding
    active_state: coding

  # ADR-044 Phase 4 — routing declared with the ``routes:`` sugar
  # (``{OUTCOME: target}``), desugared into ``^AGENT_RESULT: <OUTCOME>`` stdout
  # rules at build time. Behaviour-identical to the prior verbose ``rules:``.
  - name: review
    type: agent
    prompt: review
    queue_state: reviewing
    active_state: reviewing
    routes: { PASSED: next, FAILED: blocked }

  - name: verify
    type: agent
    prompt: verify
    conversational: true
    routes: { PASSED: next, FAILED: code }

  - name: pr_summary
    type: agent
    prompt: pr_summary
    output: pr_description
    queue_state: summarizing
    active_state: summarizing

  # ADR-045 — build ends by handing off to PR watching. ``push_pr`` opens the PR
  # then *calls* the standalone ``pr-monitor`` workflow (automatic/ungated in
  # Phase 1); the former inline ``wait_for_pr_signal`` step and the duplicated
  # ``pr_fix`` flow now live in ``pr-monitor``.
  - name: push_pr
    type: action
    tool: push_pr
    routes: { COMPLETED: call pr-monitor }

flows:
  main:
    steps:
      - plan
      - test
      - code
      - name: review
        routes: { PASSED: next, FAILED: code }
      - verify
      - pr_summary
      - push_pr
