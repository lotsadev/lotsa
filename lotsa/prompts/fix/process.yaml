process: fix
description: |
  Execute at shallow depth. A mechanical, pre-decided change (status bumps, typo
  fixes, renames, config tweaks, dependency bumps): no design conversation, no
  test writing. The coder executes a precise instruction; review checks the diff
  against that instruction, not the broad architectural checklist. Then it opens
  a PR and hands off to PR watching. Reach it from chat via the "Quick fix"
  handoff, or select it directly.
promotion_inputs:
  - name: instruction
    description: The mechanical change the operator wants applied.
jobs:
  - name: code
    type: agent
    prompt: fix_coding
    queue_state: coding
    active_state: coding

  # ``review`` references the shared, process-independent agent in the catalog
  # (``lotsa/prompts/agents/<name>/``), resolved by ``AgentPromptRegistry``
  # (ADR-044) — fix ships only its distinctive ``fix_coding`` agent (the
  # "execute this instruction" framing). The PR-phase agents (``pr-fix`` /
  # ``resolve_conflicts``) now live in the ``pr-monitor`` workflow (ADR-045).
  - name: review
    type: agent
    prompt: review
    queue_state: reviewing
    active_state: reviewing

  # ``pr_summary`` references the shared ``pr_summary`` agent in the catalog
  # (``lotsa/prompts/agents/pr_summary/``) via ``AgentPromptRegistry`` (ADR-044)
  # — fix ships no copy of the prompt. It declares no ``inputs`` (a missing spec
  # must never block it) and lives only in ``main``; a re-push keeps the existing
  # PR and must not regenerate its text — the re-push lives in ``pr-monitor``,
  # which has no ``pr_summary`` step (mirrors build). No per-step ``model:`` is
  # pinned: consistent with the bundled "ship no per-step models" policy.
  - name: pr_summary
    type: agent
    prompt: pr_summary
    output: pr_description
    queue_state: summarizing
    active_state: summarizing

  # ADR-045 — fix ends by handing off to PR watching: ``push_pr`` opens the PR
  # then *calls* the standalone ``pr-monitor`` workflow (automatic in Phase 1).
  - name: push_pr
    type: action
    tool: push_pr
    routes: { COMPLETED: call pr-monitor }

flows:
  main:
    steps:
      - code
      - name: review
        routes: { PASSED: next, FAILED: code }
      - pr_summary
      - push_pr
