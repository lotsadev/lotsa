process: chat
description: |
  Exploration and triage. Talk through an idea with the operator until the
  next step is clear, then suggest promoting to the matching process. One
  conversational step that runs as a REPL — no completion marker, no commit
  pressure. Stays open until the operator promotes or abandons it.
# ADR-044 Phase 4 — chat is a Think-phase entry point: selectable at task
# start, but never advertised as a hand-off (promotion) destination (it never
# self-refers). ``invocable`` drives this off a declared property instead of a
# hardcoded ``name == "chat"`` check.
invocable: [start]
jobs:
  - name: chat
    type: agent
    prompt: chat
    conversational: true
    # ADR-044 Phase 4c — suggesting a hand-off is edge-routed like every other
    # outcome. ``COMPLETED <workflow>`` records a hand-off suggestion (the
    # drainer's handoff branch: validate → store ``handoff_suggestion`` →
    # park) and NEVER advances or promotes. The chat step still self-completes
    # nothing — it runs as a REPL until the operator promotes (ADR-027) or
    # abandons it; ``handoff`` is a non-terminating park, not a transition.
    routes: { COMPLETED: handoff }
flows:
  # The ``main`` flow runs the single ``chat`` step with no per-flow routing
  # override, so it inherits the job-level ``routes: { COMPLETED: handoff }``
  # above (``_resolve_jobs`` falls back to ``job.rules`` when a binding declares
  # none). Don't re-declare the identical routes here — a binding-level override
  # only earns its place when it *diverges* from the job default.
  main:
    steps: [chat]
